<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Cafe | Cart</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/menu.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/6f8b0f4b91.js" crossorigin="anonymous"></script>
</head>
<body>

<header>
    <div class="logo">☕ Smart Cafe</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="orders.html">My Orders</a>
        <a href="about.html">About</a>
        <a href="cart.html" class="active" id="cartLink"><i class="fa-solid fa-cart-shopping"></i> Cart (<span id="cartCount">0</span>)</a>
        <button id="loginBtn">Login</button>
    </nav>
</header>

<section class="cart-page">
    <h1>Your Cart</h1>

    <div id="errorBox" class="error-box"></div>

    <div class="cart-layout">
        <div class="cart-items-list" id="cartItemsList">
            <p class="loading-text">Your cart is empty.</p>
        </div>

        <aside class="cart-summary">
            <h2>Order Summary</h2>
            <div class="summary-row">
                <span>Items</span>
                <span id="summaryCount">0</span>
            </div>
            <div class="summary-row total">
                <span>Total</span>
                <span id="summaryTotal">Rs. 0.00</span>
            </div>
            <textarea id="orderNote" placeholder="Any special note? (e.g. less sugar, extra hot)"></textarea>
            <button id="checkoutBtn">Place Order</button>
            <a href="menu.html" class="continue-link">← Continue browsing menu</a>
        </aside>
    </div>
</section>

<script src="js/config.js"></script>
<script src="js/cart.js"></script>
<script src="js/cart_page.js"></script>
<script src="js/app.js"></script>
</body>
</html>
