<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Cafe | Login</title>

    <link rel="stylesheet" href="css/login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://kit.fontawesome.com/6f8b0f4b91.js" crossorigin="anonymous"></script>
</head>

<body>

<div class="container">

    <div class="left">

        <div class="overlay">

            <h1>☕ Smart Cafe</h1>

            <p>
                Welcome Back!
            </p>

            <span>
                Fresh Coffee • Fast Service • Easy Ordering
            </span>

        </div>

    </div>

    <div class="right">

        <form id="loginForm">

            <h2>Login</h2>

            <div class="inputBox">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required>

            </div>

            <div class="inputBox">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required>

                <i
                    class="fa-solid fa-eye"
                    id="togglePassword">
                </i>

            </div>

            <div class="options">

                <label>

                    <input type="checkbox">

                    Remember Me

                </label>

                <a href="#">Forgot Password?</a>

            </div>

            <button type="submit">

                Login

            </button>

            <p class="register">

                Don't have an account?

                <a href="register.html">

                    Register

                </a>

            </p>

        </form>

    </div>

</div>

<script src="js/login.js"></script>

</body>

</html>
